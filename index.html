    <meta charset="UTF-8" />

  <body>
    <nav class="top-nav" aria-label="Section navigation">
      <div class="top-nav-pill">
        <div class="top-nav-links">
          <button type="button" class="top-nav-link" data-target="about-heading">About</button>
          <button type="button" class="top-nav-link" data-target="publications-heading">Publications</button>
          <button type="button" class="top-nav-link" data-target="research-heading">Research</button>
        </div>
        <a class="top-nav-cv" href="assets/files/jini-kim-cv.pdf" target="_blank" rel="noopener noreferrer">CV ↗</a>
      </div>
    </nav>

    <div class="page-wrap page-columns">
      <aside class="left-rail">
        <div class="profile-card" aria-label="Profile">
          <div class="profile-photo">
            <img
              src="assets/images/profile-circle.webp"
              alt="Portrait of Jini Kim"
              width="600"
              height="600"
              loading="eager"
              fetchpriority="high"
            />
          </div>
          <h1>Jini Kim</h1>
          <p class="role">Ph.D. Student</p>
          <p class="affiliation">Human-Computer Interaction Institute</p>
          <p class="affiliation">Carnegie Mellon University</p>
          <p class="email-link" id="email-link"></p>

          <nav class="social-icons" aria-label="Professional links">
            <div id="social-icons" class="icon-row"></div>
          </nav>
        </div>

        <section class="news-panel" aria-labelledby="news-heading">
          <h2 id="news-heading" class="eyebrow">News</h2>
          <ul id="news-list" class="news-list"></ul>
        </section>
      </aside>

      <div class="right-rail">
        <div class="hero-text">
          <h2 id="about-heading" class="hero-heading">
            👋 Hi! I'm Jini Kim —
          </h2>
          <div id="about-text" class="about-text"></div>
        </div>

        <div class="content-section" aria-labelledby="publications-heading">
          <div class="section-heading-row">
            <h2 id="publications-heading" class="eyebrow">Selected Publications</h2>
            <a
              class="full-publications-link"
              href="https://scholar.google.com/citations?user=Wt5tvbMAAAAJ&hl"
              target="_blank"
              rel="noopener noreferrer"
            >Full list on Google Scholar →</a>
          </div>
          <div id="publications-list" class="publications-list"></div>

          <section class="research-section" aria-labelledby="research-heading">
            <h2 id="research-heading">Research Experience</h2>
            <div id="research-list" class="research-list"></div>
          </section>
        </div>
      </div>
    </div>

    <script src="js/data/about.js"></script>
    <script src="js/data/social-links.js"></script>
    <script src="js/data/news.js"></script>
    <script src="js/data/publications.js"></script>
    <script src="js/data/research.js"></script>
    <script src="js/data.js"></script>
    <script>
      const emailEntry = siteData.socialLinks.find((item) => item.icon === 'email');
      const emailLink = document.getElementById('email-link');
      if (emailEntry) {
        emailLink.innerHTML = `<a href="${emailEntry.href}">${emailEntry.label}</a>`;
      }

      const iconLinks = siteData.socialLinks.filter((item) => item.icon !== 'email');
      const socialIcons = document.getElementById('social-icons');
      socialIcons.innerHTML = iconLinks
        .map(
          (item) => `
            <a
              class="icon-link"
              href="${item.href}"
              ${item.href.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}
              title="${item.label}"
              aria-label="${item.label}"
            >
              ${getSocialIcon(item.icon)}
            </a>
          `
        )
        .join('');

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = siteData.news
        .map(
          (item) => `
            <li>
              <time>${item.date}</time>
              <span>${item.text}</span>
            </li>
          `
        )
        .join('');

      const aboutText = document.getElementById('about-text');
      aboutText.innerHTML = siteData.about
        .map((paragraph) => `<p>${paragraph}</p>`)
        .join('');

      const publicationsList = document.getElementById('publications-list');
      publicationsList.innerHTML = siteData.publications
        .map(
          (pub) => {
            const pdfLink = pub.links.find((link) => link.label === 'PDF' && link.url) || pub.links.find((link) => link.url);
            const title = pdfLink
              ? `<a href="${pdfLink.url}" ${pdfLink.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}>${pub.title}</a>`
              : pub.title;
            const thumbnail = pub.thumbnail
              ? `
                <div class="publication-thumb">
                  <img src="${pub.thumbnail}" alt="" width="320" height="240" loading="lazy" />
                </div>
              `
              : '';
            return `
            <article class="publication ${pub.highlight ? 'highlighted' : ''}">
              ${thumbnail}
              <div class="publication-body">
                <h3>${title}</h3>
                <p class="authors">${pub.authors}</p>
                <div class="publication-links">
                  <span class="venue-badge">${pub.badge} ${pub.year}</span>
                  ${pub.award ? `<span class="award">${pub.award}</span>` : ''}
                  ${pub.links
                    .map((link) =>
                      link.url
                        ? `
                          <a href="${link.url}" ${link.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}>${link.label}</a>
                        `
                        : `<span class="publication-link-pending" title="Link not added yet">${link.label}</span>`
                    )
                    .join('')}
                </div>
              </div>
            </article>
          `;
          }
        )
        .join('');

      const researchList = document.getElementById('research-list');
      researchList.innerHTML = siteData.research
        .map((item) => {
          const heading = item.department
            ? `${item.institution} · ${item.department}`
            : item.institution;
          const roleLine = item.advisors
            ? `${item.role} · ${item.advisors}`
            : item.role;
          const metaParts = [item.location, item.dateRange].filter(Boolean);

          return `
            <article class="research-entry">
              <div class="research-logo">
                <img src="${item.logo}" alt="${item.institution} logo" width="56" height="56" loading="eager" />
              </div>
              <div class="research-info">
                <p class="research-institution">${heading}</p>
                <p class="research-role">${roleLine}</p>
                ${item.description ? `<p class="research-description">${item.description}</p>` : ''}
                <p class="research-meta">${metaParts.join(' · ')}</p>
              </div>
            </article>
          `;
        })
        .join('');

      function getSocialIcon(type) {
        const icons = {
          email: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6.75A1.75 1.75 0 0 1 4.75 5h14.5A1.75 1.75 0 0 1 21 6.75v10.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 1.75 0 0 1 3 17.25V6.75Zm2.1-.25 6.9 5.2 6.9-5.2H5.1Zm13.15 1.4-6.45 4.86a.75.75 0 0 1-.9 0L5.75 7.9v9.35c0 .14.11.25.25.25h12c.14 0 .25-.11.25-.25V7.9Z"/>
            </svg>
          `,
          cv: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.75 2.5A1.75 1.75 0 0 0 5 4.25v15.5c0 .966.784 1.75 1.75 1.75h10.5A1.75 1.75 0 0 0 19 19.75V8.5a.75.75 0 0 0-.22-.53l-5.5-5.5a.75.75 0 0 0-.53-.22h-5.5a.75.75 0 0 0-.5-.25Zm.5 1.5h4.5v4a1.75 1.75 0 0 0 1.75 1.75h4v10a.25.25 0 0 1-.25.25H6.75a.25.25 0 0 1-.25-.25V4.25a.25.25 0 0 1 .25-.25Zm6 .56 3.44 3.44H13.5a.25.25 0 0 1-.25-.25V4.56ZM8 13.25a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75Zm0 3.25a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75Z"/>
            </svg>
          `,
          scholar: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82ZM12 3 1 9l11 6 9-4.91V17h2V9L12 3Z"/>
            </svg>
          `,
          linkedin: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.94 5.5a1.94 1.94 0 1 1-3.88 0 1.94 1.94 0 0 1 3.88 0ZM3.5 8.75h3.38V20.5H3.5V8.75Zm6.38 0h3.24v1.6h.05c.45-.85 1.56-1.75 3.21-1.75 3.43 0 4.06 2.26 4.06 5.2V20.5h-3.38v-5.73c0-1.37-.02-3.13-1.9-3.13-1.91 0-2.2 1.5-2.2 3.03v5.83H9.88V8.75Z"/>
            </svg>
          `,
          x: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M13.63 10.4 20.2 3h-1.56l-5.7 6.43L8.4 3H3l6.9 9.63L3 20.4h1.56l6.02-6.8 4.8 6.8H21l-7.37-10Zm-2.13 2.4-.7-.97-5.55-7.73h2.4l4.47 6.23.7.97 5.82 8.1h-2.4l-4.74-6.6Z"/>
            </svg>
          `,
        };

        return icons[type] || icons.email;
      }

      // Top nav: smooth-scroll to the clicked section.
      document.querySelectorAll('.top-nav-link').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });

      // Keep "News" and "Selected Publications" starting on the same line:
      // since the hero intro text and the profile card can be different
      // heights, nudge whichever column is shorter down to match, measured
      // live so it keeps working as either side's content changes.
      function alignLeftRightRails() {
        const profileCard = document.querySelector('.profile-card');
        const heroText = document.querySelector('.hero-text');
        const leftRail = document.querySelector('.left-rail');
        const rightRail = document.querySelector('.right-rail');

        profileCard.style.marginBottom = '';
        heroText.style.marginBottom = '';

        if (window.matchMedia('(max-width: 900px)').matches) return;

        // Measure rendered HEIGHT via getBoundingClientRect rather than
        // offsetHeight: offsetHeight doesn't reflect the visual size once
        // CSS zoom is involved (profile-card and hero-text are zoomed by
        // different nested amounts), while getBoundingClientRect does.
        // Height (unlike top/position) is unaffected by scroll, so this
        // stays safe to recompute at any scroll offset.
        const leftGap = parseFloat(getComputedStyle(leftRail).rowGap) || 0;
        const rightGap = parseFloat(getComputedStyle(rightRail).rowGap) || 0;
        const diff = (profileCard.getBoundingClientRect().height + leftGap) -
          (heroText.getBoundingClientRect().height + rightGap);

        if (diff > 0) {
          heroText.style.marginBottom = `${diff}px`;
        } else if (diff < 0) {
          profileCard.style.marginBottom = `${-diff}px`;
        }
      }

      window.addEventListener('load', alignLeftRightRails);
      window.addEventListener('resize', alignLeftRightRails);
      // font-display:swap means window.load can fire before the self-hosted
      // fonts finish swapping in, leaving the alignment computed against
      // fallback-font metrics; re-run once the real fonts are confirmed ready.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(alignLeftRightRails);
      }
    </script>
  </body>
</html>
