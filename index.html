<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Academic personal website for Jini Kim, Ph.D. student in Human-Computer Interaction at Carnegie Mellon University."
    />
    <title>Jini Kim | CMU HCII </title>
    <link rel="icon" type="image/png" href="assets/images/opengraph_jini.png" />
    <link rel="apple-touch-icon" href="assets/images/opengraph_jini.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jini Kim | CMU HCII" />
    <meta
      property="og:description"
      content="Academic personal website for Jini Kim, Ph.D. student in Human-Computer Interaction at Carnegie Mellon University."
    />
    <meta property="og:url" content="https://jinikimhci.github.io/" />
    <meta property="og:image" content="https://jinikimhci.github.io/assets/images/opengraph_jini.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jini Kim | HCI Ph.D. Student" />
    <meta
      name="twitter:description"
      content="Academic personal website for Jini Kim, Ph.D. student in Human-Computer Interaction at Carnegie Mellon University."
    />
    <meta name="twitter:image" content="https://jinikimhci.github.io/assets/images/opengraph_jini.png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="top-nav" aria-label="Section navigation">
      <div class="top-nav-inner">
        <button type="button" class="top-nav-link" data-target="about-heading">About</button>
        <button type="button" class="top-nav-link" data-target="news-heading">News</button>
        <button type="button" class="top-nav-link" data-target="publications-heading">Publications</button>
        <button type="button" class="top-nav-link" data-target="research-heading">Research</button>
      </div>
    </nav>

    <div class="page-shell">
      <aside class="left-column" aria-label="Profile sidebar">
        <header class="profile-card">
          <div class="profile-photo">
            <img
              src="assets/images/profile-circle.webp"
              alt="Portrait of Jini Kim"
              width="600"
              height="600"
              loading="eager"
              fetchpriority="high"
            />
          </div>
          <h1>Jini Kim</h1>
          <p class="role">Ph.D. Student</p>
          <p class="affiliation">Human-Computer Interaction Institute</p>
          <p class="affiliation">Carnegie Mellon University</p>
          <p class="email-link" id="email-link"></p>
        </header>

        <nav class="social-icons" aria-label="Professional links">
          <div id="social-icons" class="icon-row"></div>
        </nav>

        <section class="news-panel" aria-labelledby="news-heading">
          <h2 id="news-heading">News</h2>
          <ul id="news-list" class="news-list"></ul>
        </section>
      </aside>

      <main class="right-column" aria-label="Main content">
        <section class="content-section" aria-labelledby="about-heading">
          <h2 id="about-heading">👋 Hi there!</h2>
          <div id="about-text" class="about-text"></div>
        </section>

        <section class="content-section" aria-labelledby="publications-heading">
          <h2 id="publications-heading">Publications</h2>
          <div id="publications-list" class="publications-list"></div>
        </section>

        <section class="content-section" aria-labelledby="research-heading">
          <h2 id="research-heading">Research Experience</h2>
          <div id="research-list" class="research-list"></div>
        </section>
      </main>
    </div>

    <script src="js/data/about.js"></script>
    <script src="js/data/social-links.js"></script>
    <script src="js/data/news.js"></script>
    <script src="js/data/publications.js"></script>
    <script src="js/data/research.js"></script>
    <script src="js/data.js"></script>
    <script>
      const emailEntry = siteData.socialLinks.find((item) => item.icon === 'email');
      const emailLink = document.getElementById('email-link');
      if (emailEntry) {
        emailLink.innerHTML = `<a href="${emailEntry.href}">${emailEntry.label}</a>`;
      }

      const iconLinks = siteData.socialLinks.filter((item) => item.icon !== 'email');
      const socialIcons = document.getElementById('social-icons');
      socialIcons.innerHTML = iconLinks
        .map(
          (item) => `
            <a
              class="icon-link"
              href="${item.href}"
              ${item.href.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}
              title="${item.label}"
              aria-label="${item.label}"
            >
              ${getSocialIcon(item.icon)}
            </a>
          `
        )
        .join('');

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = siteData.news
        .map(
          (item) => `
            <li>
              <time>${item.date}</time>
              <span>${item.text}</span>
            </li>
          `
        )
        .join('');

      const aboutText = document.getElementById('about-text');
      aboutText.innerHTML = siteData.about
        .map((paragraph) => `<p>${paragraph}</p>`)
        .join('');

      const publicationsList = document.getElementById('publications-list');
      publicationsList.innerHTML = siteData.publications
        .map(
          (pub) => {
            const pdfLink = pub.links.find((link) => link.label === 'PDF' && link.url) || pub.links.find((link) => link.url);
            const title = pdfLink
              ? `<a href="${pdfLink.url}" ${pdfLink.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}>${pub.title}</a>`
              : pub.title;
            return `
            <article class="publication ${pub.highlight ? 'highlighted' : ''}">
              <h3>${title}</h3>
              <p class="authors">${pub.authors}</p>
              ${pub.award ? `<p class="award">${pub.award}</p>` : ''}
              <div class="publication-links">
                <span class="venue-badge">${pub.badge} ${pub.year}</span>
                ${pub.links
                  .map((link) =>
                    link.url
                      ? `
                        <a href="${link.url}" ${link.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}>${link.label}</a>
                      `
                      : `<span class="publication-link-pending" title="Link not added yet">${link.label}</span>`
                  )
                  .join('')}
              </div>
            </article>
          `;
          }
        )
        .join('');

      const researchList = document.getElementById('research-list');
      researchList.innerHTML = siteData.research
        .map((item) => {
          const heading = item.department
            ? `${item.institution} · ${item.department}`
            : item.institution;
          const roleLine = item.advisors
            ? `${item.role} · ${item.advisors}`
            : item.role;
          const metaParts = [item.location, item.dateRange].filter(Boolean);

          return `
            <article class="research-entry">
              <div class="research-logo">
                <img src="${item.logo}" alt="${item.institution} logo" width="56" height="56" loading="eager" />
              </div>
              <div class="research-info">
                <p class="research-institution">${heading}</p>
                <p class="research-role">${roleLine}</p>
                ${item.description ? `<p class="research-description">${item.description}</p>` : ''}
                <p class="research-meta">${metaParts.join(' · ')}</p>
              </div>
            </article>
          `;
        })
        .join('');

      function getSocialIcon(type) {
        const icons = {
          email: `
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6.75A1.75 1.75 0 0 1 4.75 5h14.5A1.75 1.75 0 0 1 21 6.75v10.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 1.75 0 0 1 3 17.25V6.75Zm2.1-.25 6.9 5.2 6.9-5.2H5.1Zm13.15 1.4-6.45 4.86a.75.75 0 0 1-.9 0L5.75 7.9v9.35c0 .14.11.25.25.25h12c.14 0 .25-.11.25-.25V7.9Z"/>
            </svg>
          `,
          cv: `<img src="assets/images/cv-icon.webp" alt="" width="128" height="128" loading="eager" />`,
          scholar: `<img src="assets/images/googlescholar-icon.webp" alt="" width="128" height="128" loading="eager" />`,
          linkedin: `<img src="assets/images/linkedin-icon.webp" alt="" width="128" height="128" loading="eager" />`,
          x: `<img src="assets/images/x-icon.webp" alt="" width="128" height="128" loading="eager" />`,
        };

        return icons[type] || icons.email;
      }

      // Top nav: smooth-scroll to the clicked section, whichever container
      // actually scrolls (the whole page on mobile, or the right-column's
      // own internal scroll box on desktop).
      document.querySelectorAll('.top-nav-link').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });

      // On mobile, the stacked reading order should be About > News >
      // Publications > Research. News normally lives in the sidebar (which
      // sits before the main content in the DOM), so on narrow screens we
      // physically move the News panel to sit right after About. CSS alone
      // can't do this because they start out in different parent
      // containers. On desktop it's moved back to its original spot.
      (function () {
        const newsPanel = document.querySelector('.news-panel');
        const aboutSection = document.getElementById('about-heading').parentElement;
        const sidebarAnchor = newsPanel.previousElementSibling;
        const mobileQuery = window.matchMedia('(max-width: 900px)');

        function placeNewsForViewport(isMobile) {
          if (isMobile) {
            aboutSection.after(newsPanel);
          } else {
            sidebarAnchor.after(newsPanel);
          }
        }

        placeNewsForViewport(mobileQuery.matches);
        mobileQuery.addEventListener('change', (event) => placeNewsForViewport(event.matches));
      })();
    </script>
  </body>
</html>
